<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKKE 机器人管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景层：图片/渐变由 JS 依据配置注入 -->
  <div class="bg-layer" id="bgLayer"></div>

  <div class="app">
    <!-- 侧边导航（毛玻璃） -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-dot"></div>
        <span>NIKKE 管理端</span>
      </div>
      <nav class="nav">
        <a class="nav-item active" data-page="dashboard" href="#dashboard" aria-label="总览" title="总览">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
          <span>总览</span>
        </a>
        <a class="nav-item" data-page="services" href="#services" aria-label="服务管理" title="服务管理">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>
          <span>服务管理</span>
        </a>
        <a class="nav-item" data-page="skills" href="#skills" aria-label="技能管理" title="技能管理">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l1 4h4v14H4V7h4z"/><path d="M12 11v6M9 14h6"/></svg>
          <span>技能管理</span>
        </a>
        <a class="nav-item" data-page="ops" href="#ops" aria-label="运维监控" title="运维监控">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span>运维监控</span>
        </a>
        <a class="nav-item" data-page="config" href="#config" aria-label="配置" title="配置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3h.1a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5h.1a1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9v.1a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
          <span>配置</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-block" id="openBrowserBtn">在浏览器打开</button>
      </div>
    </aside>

    <!-- 主区域 -->
    <div class="main">
      <header class="topbar">
        <h1 id="pageTitle">总览</h1>
        <div class="topbar-right">
          <span class="daemon-pill" id="daemonPill">守护运行中</span>
          <button class="btn btn-ghost" id="bgBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>
            背景
          </button>
        </div>
      </header>

      <main class="content">
        <!-- 总览 -->
        <section class="page active" id="page-dashboard">
          <div class="hero">
            <h2>机器人运行总览</h2>
            <p>一键启动整套服务，或在下方查看各服务状态。</p>
            <div class="hero-actions">
              <button class="btn btn-primary" data-service-action="start" data-service="all">全部启动</button>
              <button class="btn btn-warn" data-service-action="restart" data-service="all">全部重启</button>
              <button class="btn btn-danger" data-service-action="stop" data-service="all">全部停止</button>
            </div>
          </div>
          <div class="card-grid" id="dashboardCards"></div>
          <div class="card">
            <h3>最近事件</h3>
            <div id="dashboardEvents" class="event-list"></div>
          </div>
        </section>

        <!-- 服务管理 -->
        <section class="page" id="page-services">
          <div class="card-grid" id="serviceCards"></div>
        </section>

        <!-- 技能管理 -->
        <section class="page" id="page-skills">
          <div class="card">
            <div class="card-head">
              <h3>机器人技能</h3>
              <button class="btn btn-primary" id="addSkillBtn">+ 添加技能</button>
            </div>
            <div id="skillList" class="skill-list"></div>
          </div>
        </section>

        <!-- 运维监控 -->
        <section class="page" id="page-ops">
          <div class="card">
            <h3>实时状态</h3>
            <div id="opsStatus" class="status-table"></div>
          </div>
          <div class="card">
            <h3>检测与告警设置</h3>
            <form id="opsForm" class="form">
              <div class="form-row">
                <label class="check daemon-toggle"><input type="checkbox" name="daemon_enabled"> 启用守护功能（自动检测 + 离线自动重启）</label>
              </div>
              <div class="form-row">
                <label>检测间隔（秒）<input type="number" name="check_interval" min="3" max="120" required></label>
                <label>失败阈值（次）<input type="number" name="fail_threshold" min="1" max="10" required></label>
              </div>
              <div class="form-row">
                <label>最大重连次数<input type="number" name="max_attempts" min="1" max="10" required></label>
                <label>重连退避（秒，逗号分隔）<input type="text" name="backoff_seconds" required></label>
              </div>
              <div class="form-row">
                <label>钉钉 Webhook<input type="password" name="dingtalk_webhook" autocomplete="off" placeholder="https://oapi.dingtalk.com/robot/send?access_token=..."></label>
                <label>钉钉 Secret<input type="password" name="dingtalk_secret" autocomplete="off" placeholder="SEC..."></label>
              </div>
              <div class="form-row">
                <label>告警冷却（分钟）<input type="number" name="cooldown_minutes" min="1" max="240" required></label>
                <label class="check"><input type="checkbox" name="notify_on_recover"> 恢复后发通知</label>
              </div>
              <button class="btn btn-primary" type="submit">保存设置</button>
            </form>
          </div>
          <div class="card">
            <h3>历史记录</h3>
            <div id="opsEvents" class="event-list"></div>
          </div>
          <div class="card">
            <h3>系统工具</h3>
            <div class="tool-actions">
              <button class="btn btn-ghost" id="btnInstallDeps">安装依赖</button>
              <button class="btn btn-ghost" id="btnShowQrcode">查看登录二维码</button>
              <button class="btn btn-ghost" id="btnShowLogs">查看日志</button>
            </div>
            <div class="tool-actions" style="margin-top:10px">
              <button class="btn btn-ghost" data-open-service="astrbot">AstrBot 后台</button>
              <button class="btn btn-ghost" data-open-service="napcat">NapCat WebUI</button>
              <button class="btn btn-ghost" data-open-service="admin">成员后台</button>
              <button class="btn btn-ghost" data-open-service="bridge">桥接健康页</button>
            </div>
          </div>
        </section>

        <!-- 配置 -->
        <section class="page" id="page-config">
          <div class="card">
            <h3>配置管理</h3>
            <div class="config-actions">
              <button class="btn btn-primary" id="exportBtn">导出配置</button>
              <button class="btn btn-ghost" id="importBtn">导入配置</button>
              <button class="btn btn-danger" id="resetBtn">恢复默认</button>
              <input type="file" id="importFile" accept="application/json,.json" hidden>
            </div>
            <p class="muted">导出的 JSON 包含：检测参数、钉钉配置、技能清单、背景设置。导入将覆盖当前配置。</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 背景设置弹窗 -->
  <div class="modal-mask" id="bgModal" hidden>
    <div class="modal">
      <h3>背景设置</h3>
      <div class="modal-body">
        <div class="form">
          <label>上传图片<input type="file" id="bgFile" accept="image/png,image/jpeg,image/webp"></label>
          <label>图片 URL<input type="text" id="bgUrl" placeholder="https://..."></label>
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="bgApplyUrl">应用 URL</button>
          <button class="btn btn-ghost" id="bgReset">恢复渐变</button>
          <button class="btn btn-ghost" id="bgClose">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加技能弹窗 -->
  <div class="modal-mask" id="skillModal" hidden>
    <form class="modal" id="skillForm">
      <h3>添加技能</h3>
      <div class="modal-body form">
        <label>技能名称<input type="text" name="name" maxlength="40" required></label>
        <label>描述<input type="text" name="desc" maxlength="120"></label>
        <label>命令前缀<input type="text" name="command" maxlength="60" placeholder="#词条" required></label>
        <label class="check"><input type="checkbox" name="enabled" checked> 默认开启</label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" id="skillClose">取消</button>
        <button class="btn btn-primary" type="submit">添加</button>
      </div>
    </form>
  </div>

  <!-- 系统工具弹窗（二维码 / 日志） -->
  <div class="modal-mask" id="toolModal" hidden>
    <div class="modal modal-wide">
      <h3 id="toolModalTitle">系统工具</h3>
      <div class="modal-body" id="toolModalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="toolModalRefresh" hidden>刷新</button>
        <button class="btn btn-ghost" id="toolModalClose">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
